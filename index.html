    if(buy&&p.money>=500){p.money-=500;var r=Math.random(),w=r<.5?0:r<.75?800:r<.9?2000:r<.98?5000:10000;p.money+=w;floatText(p,w?'+'+w:'谢谢参与',w?'#2fa24a':'#888');log(p.name+' 刮彩票：'+(w?'中奖 '+fmt(w):'没中'));updateUI();
      if(humanCtl(p))await ask(w?'🎉 中奖啦！':'😅 没中','🎫',w?'奖金 '+fmt(w):'谢谢参与，下次再来',[{t:'好的',v:1}]);else await banner('🎫 '+p.name+(w?' 中了 '+fmt(w):' 没中奖'),900)}
    return}
  if(t.t==='hospital'){p.skip=1;p.jail=false;var f=Math.min(300,p.money);log(p.name+' 住院，医药费 ¥300');floatText(p,'-300');await pay(p,300);
    if(humanCtl(p))await ask('🏥 医院','🤒','住院休息一回合，医药费 ¥300',[{t:'好吧',v:1}]);else await banner('🏥 '+p.name+' 住院一回合',900);return}
  if(t.t==='jail'){p.skip=2;p.jail=true;log(p.name+' 进了监狱 ⛓');
    if(humanCtl(p))await ask('🚔 监狱','⛓️','进监狱！休息两回合（有出狱卡可立即离开）',[{t:'唉…',v:1}]);else await banner('🚔 '+p.name+' 进监狱了',900);return}
  if(t.t==='park'){p.money+=300;floatText(p,'+300','#2fa24a');log(p.name+' 公园游玩，领补助 ¥300');updateUI();await sleep(500);return}
  if(t.t==='tax'){var tx=Math.max(300,Math.min(1500,Math.floor(p.money*.08/10)*10));log(p.name+' 缴税 '+fmt(tx));floatText(p,'-'+tx);
    if(humanCtl(p))await ask('🧾 税务局','🧾','缴纳资产税：现金的 8%（¥300~1500）<br>你需缴纳 '+fmt(tx),[{t:'缴税',v:1}]);else await banner('🧾 '+p.name+' 缴税 '+fmt(tx),900);
    await pay(p,tx);return}
  if(t.t==='shop')return shopFlow(p);
}
async function shopFlow(p){
  var stock=IK.slice().sort(function(){return Math.random()-.5}).slice(0,3);
  if(humanCtl(p)){
    var m=$('mbox');m.innerHTML='<h2>🛍️ 道具店</h2><p style="margin:2px 0 8px">你有 '+fmt(p.money)+'，最多持有 5 张</p>';
    var list=document.createElement('div');m.appendChild(list);
    await new Promise(function(res){
      stock.forEach(function(k){var it=ITEMS[k],r=document.createElement('div');r.className='row';r.innerHTML='<span class="e">'+it.e+'</span><span class="t"><b>'+it.n+'</b><br>'+it.d+'</span>';
        var b=document.createElement('button');b.className='btn';b.textContent=fmt(it.price);b.onclick=function(){if(p.money>=it.price&&p.items.length<5){p.money-=it.price;giveItem(p,k);b.textContent='已买';b.disabled=true;updateUI();log(p.name+' 买了 '+it.n)}};r.appendChild(b);list.appendChild(r)});
      var c=document.createElement('button');c.className='btn gy';c.textContent='离开';c.style.width='100%';c.onclick=function(){$('modal').classList.add('hide');res()};m.appendChild(c);$('modal').classList.remove('hide')});
  }else{
    var did=false;
    stock.forEach(function(k){var it=ITEMS[k];if(p.money-it.price>p.res+1500&&p.items.length<4&&Math.random()<.6){p.money-=it.price;giveItem(p,k);log(p.name+' 买了 '+it.n);did=true}});
    await banner('🛍️ '+p.name+(did?' 买了道具':' 逛了逛'),800);updateUI();
  }
}
async function landProp(p,t){
  if(t.owner<0){
    var buy;
    if(p.money<t.p){if(humanCtl(p))await ask(t.n,'💸','现金不足，买不起 '+fmt(t.p),[{t:'好吧',v:1}]);return}
    if(humanCtl(p))buy=await ask(t.n,'🏞️','空地！购买价 '+fmt(t.p)+'<br>空地过路费 '+fmt(Math.round(t.p*RATE[0]/10)*10)+'，盖到大厦可达 '+fmt(Math.round(t.p*RATE[3]/10)*10),[{t:'购买 '+fmt(t.p),v:true},{t:'放弃',v:false,cls:'gy'}]);
    else buy=p.money-t.p>=p.res||(Math.random()<.35&&p.money-t.p>300);
    if(buy){p.money-=t.p;t.owner=p.id;t.lv=0;floatText(p,'-'+t.p);log(p.name+' 购买了 '+t.n);updateUI();await sleep(400)}
    return;
  }
  if(t.owner===p.id){
    if(t.lv>=3){if(humanCtl(p))await banner('🏨 已是大厦！',600);return}
    var c=cost(t);if(p.money<c){return}
    var up;
    if(humanCtl(p))up=await ask(t.n,LVE[t.lv+1],'你的地产（'+LVN[t.lv]+'）<br>升级为 '+LVN[t.lv+1]+' 需要 '+fmt(c)+'<br>升级后过路费 '+fmt(Math.round(t.p*RATE[t.lv+1]/10)*10),[{t:'升级 '+fmt(c),v:true},{t:'不了',v:false,cls:'gy'}]);
    else up=p.money-c>=p.res;
    if(up){p.money-=c;t.lv++;floatText(p,'⬆️ '+LVN[t.lv]);log(p.name+' 把 '+t.n+' 升级为'+LVN[t.lv]);updateUI();await sleep(400)}
    return;
  }
  var o=G.players[t.owner];
  if(o.bankrupt)return;
  if(o.skip>0){log(o.name+' 不在家，免过路费');await banner('🏠 '+o.name+' '+(o.jail?'在监狱':'在医院')+'，免过路费！',900);return}
  var tl=toll(t);
  var si=p.items.indexOf('shield');
  if(si>=0&&tl>=300){p.items.splice(si,1);log(p.name+' 使用免费通行卡');floatText(p,'🛡️免费','#2f7fe8');await banner('🛡️ '+p.name+' 免费通行！',900);updateUI();return}
  log(p.name+' 付给 '+o.name+' 过路费 '+fmt(tl));
  floatText(p,'-'+tl);floatText(o,'+'+tl,'#2fa24a');
  if(humanCtl(p)||(o.human&&!G.auto))await ask('💸 过路费','🏠',t.n+' 属于 '+o.name+'（'+LVN[t.lv]+(mono(t)?'，垄断×1.5':'')+'）<br>'+p.name+' 需支付 '+fmt(tl),[{t:'支付',v:1}]);
  else await banner('💸 '+p.name+' → '+o.name+' '+fmt(tl),900);
  await pay(p,tl,o);
}
